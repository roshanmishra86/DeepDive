name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-release-version.mjs

  release:
    needs: validate
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Deep Work ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

  validate-manifest:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      # GitHub hides draft releases from tokens without release write access,
      # even though this job only downloads and validates an existing asset.
      contents: write
    steps:
      - uses: actions/checkout@v4
      # `gh release download <tag>` uses GitHub's release-by-tag endpoint,
      # which intentionally excludes draft releases. Resolve the draft and
      # asset through the authenticated list APIs instead.
      - name: Download updater manifest from draft release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find(item => item.tag_name === context.ref.replace('refs/tags/', ''));
            if (!release?.draft) core.setFailed('Matching draft release was not found.');
            const asset = release?.assets.find(item => item.name === 'latest.json');
            if (!asset) core.setFailed('Draft release has no latest.json asset.');
            if (!release?.draft || !asset) return;
            const response = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: asset.id,
              headers: { accept: 'application/octet-stream' },
            });
            require('fs').writeFileSync('latest.json', Buffer.from(response.data));
      - run: node scripts/validate-update-manifest.mjs latest.json
